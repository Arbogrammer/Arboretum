name: macOS x64 build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK 4
        run: brew install gtk4 pkg-config

      - name: Build macOS app bundle
        run: bash packaging/macos/build-macos.sh

      - name: Test packaged macOS app
        run: python3 packaging/test-runtime.py dist/Arboretum.app/Contents/MacOS/Arboretum

      - name: Upload runtime test logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macOS-test-logs
          path: dist/test-logs/
          if-no-files-found: warn

      - name: Upload macOS package
        uses: actions/upload-artifact@v5
        with:
          name: Arboretum-macOS-x64
          path: dist/Arboretum-macOS-x64.zip
          if-no-files-found: error
