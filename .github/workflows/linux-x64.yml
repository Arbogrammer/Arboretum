name: Linux x64 build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev librsvg2-common curl xvfb xauth gdb
      - name: Run regression suite
        run: |
          sudo sysctl -w kernel.core_pattern="$PWD/dist/core.%p"
          mkdir -p dist
          ulimit -c unlimited
          make test-core
      - name: Diagnose failed regression tests
        if: failure()
        run: |
          for core in dist/core.*; do
            [ -f "$core" ] || continue
            gdb -batch -ex 'thread apply all bt' ./arboretum "$core" > "$core.backtrace.txt" 2>&1
            cat "$core.backtrace.txt"
            rm "$core"
          done
      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh
      - name: Test packaged AppImage
        run: xvfb-run -a python3 packaging/test-runtime.py dist/Arboretum-Linux-x64.AppImage
      - name: Upload runtime test logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Linux-test-logs
          path: dist/test-logs/
          if-no-files-found: warn
      - name: Upload Linux package
        uses: actions/upload-artifact@v5
        with:
          name: Arboretum-Linux-x64
          path: dist/Arboretum-Linux-x64.AppImage
          if-no-files-found: error

  visual:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install reference rendering environment
        run: bash packaging/install-visual-deps.sh
      - name: Compare screenshots
        run: make test-visual
      - name: Upload screenshot report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Linux-visual-tests
          path: dist/test-logs/
          if-no-files-found: warn
