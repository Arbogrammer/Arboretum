name: Linux x64 build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev librsvg2-common curl xvfb xauth
      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh
      - name: Test packaged AppImage
        run: xvfb-run -a python3 packaging/test-runtime.py dist/Arboretum-Linux-x64.AppImage
      - name: Upload runtime test logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Linux-test-logs
          path: dist/test-logs/
          if-no-files-found: warn
      - name: Upload Linux package
        uses: actions/upload-artifact@v5
        with:
          name: Arboretum-Linux-x64
          path: dist/Arboretum-Linux-x64.AppImage
          if-no-files-found: error
